
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas de perfil</title>

    <!-- Iconos Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Archivo de estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="perfiles">
        <article class="perfil">
            <div class="perfil__portada perfil__portada--rosa"></div>

            <img class="perfil__foto"
                 src="https://i.pravatar.cc/150?img=47"
                 alt="Fotografía del primer perfil">

            <div class="perfil__contenido">
                <h2 class="perfil__nombre">Alexander Solarte</h2>
                <p class="perfil__descripcion">
                    Estudiante de Tecnología en Electrónica Industrial.
                    Apasionado por la tecnología y el desarrollo web.
                </p>

                <div class="perfil__redes">
                    <a class="perfil__enlace" href="https://facebook.com"
                       target="_blank" rel="noopener noreferrer"
                       aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a class="perfil__enlace" href="https://instagram.com"
                       target="_blank" rel="noopener noreferrer"
                       aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a class="perfil__enlace" href="https://github.com"
                       target="_blank" rel="noopener noreferrer"
                       aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </div>
            </div>
        </article>

        <article class="perfil">
            <div class="perfil__portada perfil__portada--morada"></div>

            <img class="perfil__foto"
                 src="https://i.pravatar.cc/150?img=12"
                 alt="Fotografía del segundo perfil">

            <div class="perfil__contenido">
                <h2 class="perfil__nombre">Desarrollador Web</h2>
                <p class="perfil__descripcion">
                    Diseño de páginas web con HTML y CSS,
                    creatividad y aprendizaje constante.
                </p>

                <div class="perfil__redes">
                    <a class="perfil__enlace" href="https://facebook.com"
                       target="_blank" rel="noopener noreferrer"
                       aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a class="perfil__enlace" href="https://instagram.com"
                       target="_blank" rel="noopener noreferrer"
                       aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a class="perfil__enlace" href="https://github.com"
                       target="_blank" rel="noopener noreferrer"
                       aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </div>
            </div>
        </article>
    </main>

</body>
</html>
